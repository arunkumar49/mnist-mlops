# Runs on every `git commit`. Update pinned versions with: uv run pre-commit autoupdate
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit message format (runs when you write the message, not on files)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Our own tools, run from uv.lock so versions match `make check` exactly
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: architecture contracts
        entry: uv run --frozen lint-imports
        language: system
        types: [python]
        pass_filenames: false
